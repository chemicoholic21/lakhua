[package]
name = "lakhua"
version = "0.1.0"
edition = "2021"
authors = ["Lakhua Contributors"]
description = "Fast, offline reverse geocoding for India using H3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aialok/lakhua"
keywords = ["geocoding", "reverse-geocoding", "h3", "india", "offline"]
categories = ["science::geo"]

[dependencies]
h3o = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
thiserror = "1.0"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "geocoder_benchmark"
harness = false
